# Production overlay – synced by Argo CD.
# The image tags are set by the GitHub Action on every push to main (commit SHA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-ems
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: ai-ems
      environment: production
images:
  - name: ghcr.io/aaron04648/ai-ems-web
    newTag: ebac1a31f71a88c9fe3dea115ed9137f205fc066
  - name: ghcr.io/aaron04648/ai-ems-fetcher
    newTag: ebac1a31f71a88c9fe3dea115ed9137f205fc066
  - name: ghcr.io/aaron04648/ai-ems-api
    newTag: ebac1a31f71a88c9fe3dea115ed9137f205fc066
