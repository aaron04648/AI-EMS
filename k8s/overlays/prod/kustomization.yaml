# Produktiv-Overlay – wird von Argo CD synchronisiert.
# Die Image-Tags setzt die GitHub Action bei jedem Push auf main (Commit-SHA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-ems
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: ai-ems
      environment: production
images:
  - name: ghcr.io/aaron04648/ai-ems-web
    newTag: 7743c56c986f0e445825a2308e5a119f067298b8
  - name: ghcr.io/aaron04648/ai-ems-fetcher
    newTag: 7743c56c986f0e445825a2308e5a119f067298b8
  - name: ghcr.io/aaron04648/ai-ems-api
    newTag: 7743c56c986f0e445825a2308e5a119f067298b8
