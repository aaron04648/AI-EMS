apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ems
  labels:
    app.kubernetes.io/name: ai-ems
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ems
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ems
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        # Webseite (nginx) – liefert SPA und /data/*.json aus
        - name: web
          image: ghcr.io/aaron04648/ai-ems-web
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /srv/data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Fetcher – aktualisiert die Snapshots alle INTERVAL_MINUTES
        - name: fetcher
          image: ghcr.io/aaron04648/ai-ems-fetcher
          env:
            - name: OUT_DIR
              value: /srv/data
            - name: INTERVAL_MINUTES
              value: "180"
          volumeMounts:
            - name: data
              mountPath: /srv/data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
