# Python-Backend: PV-Prognose (PVGIS + MeteoSwiss), MPC, Backtest.
# Der Service heisst „api“, weil nginx im Web-Pod auf http://api:8000 weiterleitet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ems-api
  labels:
    app.kubernetes.io/name: ai-ems-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ems-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ems-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api
          image: ghcr.io/aaron04648/ai-ems-api
          ports:
            - name: http
              containerPort: 8000
          env:
            # Day-Ahead-Preise aus dem Snapshot des Fetchers (Service ai-ems → nginx /data)
            - name: SNAPSHOT_URL
              value: http://ai-ems/data
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: ai-ems-api
spec:
  selector:
    app.kubernetes.io/name: ai-ems-api
  ports:
    - name: http
      port: 8000
      targetPort: http
