<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI-EMS – Understanding dynamic electricity tariffs</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Why electricity prices rise and fall: analysis of day-ahead prices in Switzerland and Europe (Energy-Charts) and a savings calculator for the dynamic EKZ tariff."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the theme before the app starts – prevents a flash in the wrong mode
      (function () {
        var t = null;
        try { t = localStorage.getItem('ai-ems-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
