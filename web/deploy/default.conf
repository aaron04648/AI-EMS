# AI-EMS – nginx für die Angular-SPA und die Daten-Snapshots
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Snapshots des Fetchers (geteiltes Volume /srv/data) – immer frisch ausliefern.
    # Fehlt eine Datei noch (Pod gerade gestartet), greift der beim Build
    # eingebackene Snapshot aus dem Image.
    location /data/ {
        root /srv;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @seed;
    }

    location @seed {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Gehashte Bundles dürfen lange gecacht werden
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Python-Backend (FastAPI) – Service „api“ in Docker Compose und Kubernetes
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Simulationen (MPC-Backtest) dauern bis ~1 min
        proxy_read_timeout 180s;
        client_max_body_size 64k;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA-Routing: unbekannte Pfade → index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
