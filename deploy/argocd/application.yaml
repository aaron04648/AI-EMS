# Argo CD watches k8s/overlays/prod on main and syncs automatically.
# Every push to main → GitHub Action builds images → sets new tags in the overlay
# → Argo CD detects the commit and rolls out the new version.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-ems
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aaron04648/AI-EMS.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-ems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
